
<style>
*{box-sizing:border-box;margin:0;padding:0}
.sec{margin-bottom:1.5rem}
.stitle{font-size:15px;font-weight:500;color:var(--color-text-primary);margin-bottom:12px}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem}
.metric{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:1rem}
.mlabel{font-size:12px;color:var(--color-text-secondary);margin-bottom:4px}
.mval{font-size:20px;font-weight:500;color:var(--color-text-primary)}
.msub{font-size:11px;color:var(--color-text-secondary);margin-top:2px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
label{font-size:13px;color:var(--color-text-secondary);display:block;margin-bottom:4px}
.inp{font-size:14px;padding:6px 8px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);width:100%}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:var(--border-radius-md);font-weight:500}
.t-blue{background:#E6F1FB;color:#0C447C}
.t-teal{background:#E1F5EE;color:#085041}
.t-amber{background:#FAEEDA;color:#633806}
.t-purple{background:#EEEDFE;color:#3C3489}
.path-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.pct-row{display:flex;align-items:center;gap:8px}
.pct-row input[type=range]{flex:1}
.pct-val{font-size:13px;font-weight:500;color:var(--color-text-primary);min-width:36px;text-align:right}
.nis-val{font-size:12px;color:var(--color-text-secondary);margin-top:3px}
.warn{font-size:12px;margin-top:8px}
.warn-ok{color:#0F6E56}.warn-bad{color:#993C1D}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tab{font-size:13px;padding:5px 14px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:transparent;color:var(--color-text-secondary);cursor:pointer}
.tab.active{background:var(--color-background-secondary);color:var(--color-text-primary);font-weight:500}
.chart-wrap{position:relative;width:100%;height:260px}
.prop-bar{height:8px;border-radius:4px;background:var(--color-background-secondary);margin:8px 0;overflow:hidden;display:flex}
.equity-pulse{background:#1D9E75}.loan-pulse{background:#378ADD}
.loan-hero{background:var(--color-background-info);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.hero-label{font-size:13px;color:var(--color-text-info);margin-bottom:2px}
.hero-val{font-size:22px;font-weight:500;color:var(--color-text-info)}
.hero-sub{font-size:12px;color:var(--color-text-info);opacity:.8}
.mpay-banner{background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:1.5rem}
</style>

<h2 class="sr-only">Israeli mortgage simulator with equity, loan amount, linked path sliders and monthly payment</h2>

<div style="padding:1rem 0">

<div class="sec card">
  <div class="stitle">Property & equity</div>
  <div class="grid2" style="margin-bottom:12px">
    <div>
      <label>Property value (NIS)</label>
      <input class="inp" type="number" id="propValue" value="2000000" step="50000" min="100000">
    </div>
    <div>
      <label>Initial equity / down payment (NIS)</label>
      <input class="inp" type="number" id="equity" value="500000" step="10000" min="0">
    </div>
  </div>
  <div class="prop-bar" id="propBar">
    <div class="equity-pulse" id="equityBar" style="width:25%"></div>
    <div class="loan-pulse" id="loanBar" style="width:75%"></div>
  </div>
  <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--color-text-secondary)">
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#1D9E75;margin-right:4px"></span>Equity <span id="equityPct" style="font-weight:500;color:var(--color-text-primary)">25%</span> — ₪<span id="equityNis">500,000</span></span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#378ADD;margin-right:4px"></span>Loan <span id="loanPct" style="font-weight:500;color:var(--color-text-primary)">75%</span> — ₪<span id="loanNis">1,500,000</span></span>
  </div>
</div>

<div class="sec">
  <div class="stitle">Loan paths</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px" id="pathsGrid"></div>
  <div class="warn" id="shareWarn"></div>
</div>

<div style="margin-bottom:1.5rem">
  <button onclick="runSim()" style="padding:9px 28px;font-size:14px">Calculate ↗</button>
</div>

<div id="mpayBanner" style="display:none" class="mpay-banner">
  <div>
    <div style="font-size:13px;color:var(--color-text-secondary);margin-bottom:2px">First monthly payment</div>
    <div style="font-size:28px;font-weight:500;color:var(--color-text-primary)" id="mpayVal">—</div>
  </div>
  <div style="text-align:right">
    <div style="font-size:13px;color:var(--color-text-secondary);margin-bottom:2px">of which interest</div>
    <div style="font-size:18px;font-weight:500;color:var(--color-text-primary)" id="mpayInt">—</div>
    <div style="font-size:12px;color:var(--color-text-secondary);margin-top:2px" id="mpayPrinc">principal: —</div>
  </div>
</div>

<div class="sec" id="summarySection" style="display:none">
  <div class="grid4" id="summaryCards"></div>
</div>

<div class="sec card" id="chartSection" style="display:none">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('payment',this)">Monthly payment</button>
    <button class="tab" onclick="switchTab('balance',this)">Remaining balance</button>
    <button class="tab" onclick="switchTab('breakdown',this)">Interest vs principal</button>
  </div>
  <div class="chart-wrap"><canvas id="mainChart" role="img" aria-label="Mortgage amortization chart"></canvas></div>
</div>

<div class="sec" id="pathDetailSection" style="display:none">
  <div class="stitle">Per-path breakdown</div>
  <div class="grid2" id="pathCards"></div>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const PATHS=[
  {name:"Prime",        share:33, years:30, rate:4.45, cpi:0,   tag:"t-blue"},
  {name:"Fixed unlinked",share:34, years:25, rate:4.80, cpi:0,   tag:"t-teal"},
  {name:"Fixed CPI-linked",share:20, years:25, rate:3.30, cpi:2.0, tag:"t-amber"},
  {name:"Variable 5y",  share:13, years:30, rate:4.50, cpi:0,   tag:"t-purple"},
];
let chartInst=null, currentTab='payment', lastMonthly=null, lastDetails=null;
let adjusting=false;

function fmt(n){return Math.round(n).toLocaleString('he-IL')}

function getLoan(){
  const prop=parseFloat(document.getElementById('propValue').value)||2000000;
  const eq=parseFloat(document.getElementById('equity').value)||0;
  return Math.max(0,prop-eq);
}

function updatePropertyBar(){
  const prop=parseFloat(document.getElementById('propValue').value)||2000000;
  const eq=Math.min(parseFloat(document.getElementById('equity').value)||0, prop);
  const loan=Math.max(0,prop-eq);
  const eqPct=Math.round(eq/prop*100);
  const lnPct=100-eqPct;
  document.getElementById('equityBar').style.width=eqPct+'%';
  document.getElementById('loanBar').style.width=lnPct+'%';
  document.getElementById('equityPct').textContent=eqPct+'%';
  document.getElementById('loanPct').textContent=lnPct+'%';
  document.getElementById('equityNis').textContent=fmt(eq);
  document.getElementById('loanNis').textContent=fmt(loan);
  refreshPathAmounts();
}

function refreshPathAmounts(){
  const loan=getLoan();
  PATHS.forEach((p,i)=>{
    const el=document.getElementById('shareNis_'+i);
    if(el) el.textContent='₪'+fmt(loan*p.share/100);
  });
  updateShareWarn();
}

document.getElementById('propValue').addEventListener('input',updatePropertyBar);
document.getElementById('equity').addEventListener('input',updatePropertyBar);

function buildPathCards(){
  const g=document.getElementById('pathsGrid');
  g.innerHTML='';
  const loan=getLoan();
  PATHS.forEach((p,i)=>{
    const nisVal=Math.round(loan*p.share/100);
    const div=document.createElement('div');
    div.className='path-card';
    div.innerHTML=`
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span class="tag ${p.tag}">${p.name}</span>
      </div>
      <div>
        <label>Share of loan</label>
        <div class="pct-row">
          <input type="range" min="0" max="100" step="1" value="${p.share}" id="share_${i}" oninput="onShareChange(${i},this.value)">
          <span class="pct-val" id="sharePct_${i}">${p.share}%</span>
        </div>
        <div class="nis-val" id="shareNis_${i}">₪${fmt(nisVal)}</div>
      </div>
      <div class="row3">
        <div><label>Years</label><input class="inp" type="number" id="years_${i}" value="${p.years}" min="1" max="40" step="1"></div>
        <div><label>Rate %</label><input class="inp" type="number" id="rate_${i}" value="${p.rate}" min="0" max="20" step="0.05"></div>
        <div><label>CPI %</label><input class="inp" type="number" id="cpi_${i}" value="${p.cpi}" min="0" max="10" step="0.1"></div>
      </div>
    `;
    g.appendChild(div);
  });
  updateShareWarn();
}

function onShareChange(changed, val){
  if(adjusting) return;
  adjusting=true;
  const newVal=parseFloat(val);
  const oldVal=PATHS[changed].share;
  const delta=newVal-oldVal;
  PATHS[changed].share=newVal;

  const others=PATHS.map((_,i)=>i).filter(i=>i!==changed);
  const otherSum=others.reduce((s,i)=>s+PATHS[i].share,0);

  if(otherSum>0){
    others.forEach(i=>{
      PATHS[i].share=Math.max(0, PATHS[i].share - delta*(PATHS[i].share/otherSum));
      PATHS[i].share=Math.round(PATHS[i].share*10)/10;
    });
  }

  const total=PATHS.reduce((s,p)=>s+p.share,0);
  if(Math.abs(total-100)>0.5){
    const diff=100-total;
    const last=others[others.length-1];
    PATHS[last].share=Math.max(0,PATHS[last].share+diff);
    PATHS[last].share=Math.round(PATHS[last].share*10)/10;
  }

  const loan=getLoan();
  PATHS.forEach((p,i)=>{
    document.getElementById('share_'+i).value=p.share;
    document.getElementById('sharePct_'+i).textContent=p.share.toFixed(0)+'%';
    document.getElementById('shareNis_'+i).textContent='₪'+fmt(loan*p.share/100);
  });

  updateShareWarn();
  adjusting=false;
}

function updateShareWarn(){
  const total=PATHS.reduce((s,p)=>s+p.share,0);
  const el=document.getElementById('shareWarn');
  if(Math.abs(total-100)<1){
    el.innerHTML='<span class="warn-ok">✓ Paths sum to 100%</span>';
  } else {
    el.innerHTML=`<span class="warn-bad">⚠ Paths sum to ${total.toFixed(0)}% — should be 100%</span>`;
  }
}

function getPaths(){
  const loan=getLoan();
  return PATHS.map((p,i)=>({
    name:p.name, tag:p.tag,
    share:p.share/100,
    years:parseInt(document.getElementById('years_'+i).value)||20,
    annual_rate:parseFloat(document.getElementById('rate_'+i).value)||0,
    annual_index:parseFloat(document.getElementById('cpi_'+i).value)||0,
    _amount:loan*p.share/100
  }));
}

function monthlyPayment(principal,annualRate,years){
  const r=annualRate/100/12, n=years*12;
  if(r===0) return principal/n;
  return principal*r/(1-Math.pow(1+r,-n));
}

function simulatePath(path){
  const principal=path._amount;
  const months=path.years*12;
  const mr=path.annual_rate/100/12;
  const mi=path.annual_index/100/12;
  let payment=monthlyPayment(principal,path.annual_rate,path.years);
  let balance=principal;
  const rows=[];
  for(let m=1;m<=months;m++){
    balance*=(1+mi);
    const interest=balance*mr;
    let pp=payment-interest, payActual=payment;
    if(pp>balance){pp=balance;payActual=interest+pp;}
    balance-=pp;
    if(balance<0)balance=0;
    rows.push({month:m,path:path.name,payment:payActual,interest,principal:pp,balance});
    if(balance<=0.01)break;
  }
  return rows;
}

function runSim(){
  const paths=getPaths();
  const total=paths.reduce((s,p)=>s+p.share,0);
  if(Math.abs(total-1)>0.02){alert('Path shares must sum to 100%');return;}

  const allDetails=paths.flatMap(p=>simulatePath(p));
  const monthMap={};
  allDetails.forEach(r=>{
    if(!monthMap[r.month])monthMap[r.month]={tp:0,ti:0,tpr:0,rb:0};
    monthMap[r.month].tp+=r.payment;
    monthMap[r.month].ti+=r.interest;
    monthMap[r.month].tpr+=r.principal;
    monthMap[r.month].rb+=r.balance;
  });
  const monthly=Object.entries(monthMap).map(([m,v])=>({month:parseInt(m),...v})).sort((a,b)=>a.month-b.month);
  const totalPaid=monthly.reduce((s,r)=>s+r.tp,0);
  const totalInt=monthly.reduce((s,r)=>s+r.ti,0);
  const loan=getLoan();
  lastMonthly=monthly; lastDetails=allDetails;

  const m1=monthly[0];
  document.getElementById('mpayBanner').style.display='';
  document.getElementById('mpayVal').textContent='₪'+fmt(m1.tp);
  document.getElementById('mpayInt').textContent='₪'+fmt(m1.ti);
  document.getElementById('mpayPrinc').textContent='principal: ₪'+fmt(m1.tpr);

  document.getElementById('summarySection').style.display='';
  document.getElementById('chartSection').style.display='';
  document.getElementById('pathDetailSection').style.display='';

  const eq=parseFloat(document.getElementById('equity').value)||0;
  document.getElementById('summaryCards').innerHTML=`
    <div class="metric"><div class="mlabel">Loan amount</div><div class="mval">₪${fmt(loan)}</div><div class="msub">after ₪${fmt(eq)} equity</div></div>
    <div class="metric"><div class="mlabel">Total paid</div><div class="mval">₪${fmt(totalPaid)}</div></div>
    <div class="metric"><div class="mlabel">Total interest</div><div class="mval">₪${fmt(totalInt)}</div><div class="msub">${(totalInt/loan*100).toFixed(1)}% of loan</div></div>
    <div class="metric"><div class="mlabel">Duration</div><div class="mval">${(monthly[monthly.length-1].month/12).toFixed(1)} yrs</div></div>
  `;

  const pc=document.getElementById('pathCards');
  pc.innerHTML='';
  paths.forEach((p,i)=>{
    const rows=allDetails.filter(r=>r.path===p.name);
    const tp=rows.reduce((s,r)=>s+r.payment,0);
    const ti=rows.reduce((s,r)=>s+r.interest,0);
    const m1p=rows[0];
    const div=document.createElement('div');
    div.className='path-card';
    div.innerHTML=`
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px">
        <span class="tag ${p.tag}">${p.name}</span>
        <span style="font-size:12px;color:var(--color-text-secondary)">${(p.share*100).toFixed(0)}% · ${p.annual_rate}% · ${p.annual_index>0?'CPI '+p.annual_index+'%':'no CPI'}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div><div style="font-size:11px;color:var(--color-text-secondary)">Principal</div><div style="font-size:15px;font-weight:500">₪${fmt(p._amount)}</div></div>
        <div><div style="font-size:11px;color:var(--color-text-secondary)">1st month payment</div><div style="font-size:15px;font-weight:500;color:#185FA5">₪${fmt(m1p.payment)}</div></div>
        <div><div style="font-size:11px;color:var(--color-text-secondary)">Total paid</div><div style="font-size:15px;font-weight:500">₪${fmt(tp)}</div></div>
        <div><div style="font-size:11px;color:var(--color-text-secondary)">Total interest</div><div style="font-size:15px;font-weight:500">₪${fmt(ti)}</div></div>
      </div>
    `;
    pc.appendChild(div);
  });

  drawChart(monthly,currentTab);
}

function drawChart(monthly,tab){
  if(chartInst){chartInst.destroy();chartInst=null;}
  const labels=monthly.map(r=>(r.month===1||r.month%12===0)?'M'+r.month:'');
  let datasets=[];
  if(tab==='payment'){
    datasets=[{label:'Monthly payment',data:monthly.map(r=>Math.round(r.tp)),borderColor:'#378ADD',backgroundColor:'rgba(55,138,221,0.08)',tension:0.3,fill:true,borderWidth:2,pointRadius:0}];
  } else if(tab==='balance'){
    datasets=[{label:'Remaining balance',data:monthly.map(r=>Math.round(r.rb)),borderColor:'#1D9E75',backgroundColor:'rgba(29,158,117,0.08)',tension:0.3,fill:true,borderWidth:2,pointRadius:0}];
  } else {
    datasets=[
      {label:'Interest',data:monthly.map(r=>Math.round(r.ti)),borderColor:'#E24B4A',backgroundColor:'rgba(226,75,74,0.12)',tension:0.3,fill:true,borderWidth:2,pointRadius:0},
      {label:'Principal',data:monthly.map(r=>Math.round(r.tpr)),borderColor:'#1D9E75',backgroundColor:'rgba(29,158,117,0.12)',tension:0.3,fill:true,borderWidth:2,pointRadius:0},
    ];
  }
  const ctx=document.getElementById('mainChart').getContext('2d');
  chartInst=new Chart(ctx,{
    type:'line',data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:datasets.length>1,labels:{boxWidth:10,font:{size:12}}},
        tooltip:{callbacks:{
          title:items=>'Month '+monthly[items[0].dataIndex]?.month,
          label:item=>item.dataset.label+': ₪'+item.formattedValue
        }}
      },
      scales:{
        x:{ticks:{maxRotation:0,autoSkip:false,font:{size:11},callback:(v,i)=>labels[i]},grid:{display:false}},
        y:{ticks:{font:{size:11},callback:v=>'₪'+Math.round(v/1000)+'k'},grid:{color:'rgba(128,128,128,0.1)'}}
      }
    }
  });
}

function switchTab(tab,el){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  if(lastMonthly)drawChart(lastMonthly,tab);
}

buildPathCards();
updatePropertyBar();
</script>
